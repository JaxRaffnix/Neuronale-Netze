[project]
name = "neuronale-netze"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datawrangler>=0.2",
    "hiddenlayer>=0.3",
    "ipykernel>=7.2.0",
    "ipynbname>=2025.8.0.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "nvidia-ml-py>=13.590.48",
    "optuna>=4.7.0",
    "plotly>=6.5.2",
    "pynvml>=13.0.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "torchsummary>=1.5.1",
    "torchvision>=0.25.0",
    "torchviz>=0.0.3",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
